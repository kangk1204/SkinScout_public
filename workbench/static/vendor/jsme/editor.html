<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>구조 그리기</title>
<style>
  html,body{margin:0;padding:0;font:14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;
            background:#f7f9fb;color:#16202b}
  #jsme{width:100%;height:340px}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 2px}
  .bar button{font:inherit;padding:7px 14px;border:1px solid #dde3ea;border-radius:6px;
              background:#fff;cursor:pointer}
  .bar button.primary{background:#1f6f6b;color:#fff;border-color:#1f6f6b}
  .bar code{font-size:12px;color:#5d6b7a;overflow-wrap:anywhere}
  .note{color:#5d6b7a;font-size:12px;padding:0 2px 8px}
</style>
</head><body>
<div id="jsme"></div>
<div class="bar">
  <button type="button" class="primary" id="use">이 구조 사용</button>
  <button type="button" id="clear">지우기</button>
  <code id="smiles"></code>
</div>
<p class="note">벤젠 고리는 도구 모음에서, 원소는 오른쪽 표에서 고릅니다. 그린 뒤 <strong>이 구조 사용</strong>을 누르세요.</p>
<script src="editor.js"></script>
<script src="jsme/jsme.nocache.js"></script>
</body></html>
