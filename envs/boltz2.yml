name: cosmax-boltz2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.3
  - biopython=1.84
  - rdkit=2025.03
  - openbabel=3.1.1
  - prody=2.6.1
  - hmmer
  - hhsuite
  - mmseqs2=15
  - pip
  - pip:
      # Verified on RTX 3080 Ti / NVIDIA driver 595.71.05.
      # Keep PyTorch on pip; conda solved this env to a CPU-only torch build.
      - torch==2.12.1
      - boltz==2.2.1
      - cuequivariance==0.10.0
      - cuequivariance-torch==0.10.0
      - cuequivariance-ops-cu12==0.10.0
      - cuequivariance-ops-torch-cu12==0.10.0
      - posebusters==0.4.3
      - prolif==2.0.3
      # PSICHIC + RTMScore adapters use upstream checkouts outside conda:
      #   PSICHIC_ROOT=${PSICHIC_ROOT:-$HOME/.local/opt/PSICHIC}
      #   RTMSCORE_ROOT=${RTMSCORE_ROOT:-$HOME/.local/opt/RTMScore}
      # GNINA is provided by a CUDA-aware wrapper on PATH.
      - torch-geometric==2.8.0
      - fair-esm==2.0.0
      - lmdb==2.2.1
      - biopandas==0.5.1
      - timeout-decorator==0.5.0
      - py3Dmol==2.5.5
      - umap-learn==0.5.12
      - plotly==6.8.0
      - mplcursors==0.7.1
      - lifelines==0.30.3
      - reprint==0.6.0
      - dgl==1.1.3
      - dgllife==0.3.2
      - torchdata==0.7.1
